  "Šiandien kažkas pasakys, kad namie nieko neprižiūri, ir po mėnesio grįš nustebusi.",
  "Šiandien ventiliatorius pūs ne į tą pusę. Pastebėsi tik pabaigoj.",
  "Kažkas atvažiuos su tušu ir pasakys, kad vakar buvo šventė.",
  "Šiandien pagalvosi, kad reikia pertraukos. Pertrauka bus dešimt minučių prie kriauklės.",
  "Šiandien kažkas paklaus, per kiek laiko to išmokstama. Neturėsi kaip atsakyti trumpai.",
  "Šiandien nugara primins apie save anksčiau nei laikrodis.",
  "Šiandien paskutinė klientė užtruks ilgiausiai ir išeis laimingiausia.",
  "Prognozė tiksli: šiandien tavo rankos padarys daugiau, nei kas nors pastebės."
];
const p = document.getElementById("p"), b = document.getElementById("b"), nr = document.getElementById("nr");
let bag = [];
function pick(){
  if(!bag.length){ n = 0; bag = PROGNOZES.map((t,i)=>i); for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];} }
  return bag.pop();
}
let n = 0;
function next(){
  const i = pick();
  p.classList.add("out");
  setTimeout(()=>{
    p.textContent = PROGNOZES[i];
    nr.textContent = "PROGNOZĖ " + (++n) + " IŠ " + PROGNOZES.length;
    p.classList.remove("out");
    b.textContent = "Duok dar vieną";
  },220);
}
b.addEventListener("click", e => { e.stopPropagation(); next(); });
document.body.addEventListener("click", next);
</script>
</body>
